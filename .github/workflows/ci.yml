name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # ==================== Lint & Type Check ====================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies (root workspace)
        run: pnpm install --frozen-lockfile

      - name: Run ESLint (Web)
        run: cd web && pnpm run lint || true
        continue-on-error: true

      - name: TypeScript type check (Payload CMS)
        run: cd payload-cms && npx tsc --noEmit || true
        continue-on-error: true

      - name: TypeScript type check (CDP)
        run: cd cdp && npm run type-check || true
        continue-on-error: true

  # ==================== Build Payload CMS ====================
  build-payload-cms:
    name: Build Payload CMS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies (root workspace)
        run: pnpm install --frozen-lockfile

      - name: Build Payload CMS
        run: cd payload-cms && pnpm run build
        env:
          DATABASE_URI: postgresql://test:test@localhost:5432/test
          PAYLOAD_SECRET: ci-build-test-secret-32chars-minimum
          NEXT_PUBLIC_CDP_DASHBOARD_URL: https://cdp.busromhouse.com/

  # ==================== Build Web ====================
  build-web:
    name: Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies (root workspace)
        run: pnpm install --frozen-lockfile

      - name: Build Web
        run: cd web && pnpm run build
        env:
          CMS_URL: http://localhost:3002
          CMS_GRAPHQL_URL: http://localhost:3002/api/graphql
          NEXT_PUBLIC_CDP_ENDPOINT: https://cdp.busromhouse.com/api/analytics/track

  # ==================== Docker Build Test ====================
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Payload CMS Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.payload-cms
          push: false
          tags: busrom-payload-cms:latest
          cache-from: type=gha,scope=payload-cms
          cache-to: type=gha,mode=min,scope=payload-cms
          build-args: |
            NEXT_PUBLIC_CDP_DASHBOARD_URL=https://cdp.busromhouse.com/

      - name: Build Web Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.web
          push: false
          tags: busrom-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=min,scope=web
          build-args: |
            NEXT_PUBLIC_CDP_ENDPOINT=https://cdp.busromhouse.com/api/analytics/track

      - name: Build CDP Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./cdp
          file: ./cdp/Dockerfile
          push: false
          tags: busrom-cdp:latest
          cache-from: type=gha,scope=cdp
          cache-to: type=gha,mode=min,scope=cdp

  # ==================== Security Scan ====================
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run pnpm audit (Web)
        run: cd web && pnpm audit --audit-level=high || true
        continue-on-error: true

      - name: Run pnpm audit (Payload CMS)
        run: cd payload-cms && pnpm audit --audit-level=high || true
        continue-on-error: true
