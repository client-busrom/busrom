name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # ==================== Lint & Type Check ====================
  lint:
    name: Lint & Type Check
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (root workspace)
        run: npm ci

      - name: Run ESLint (Web)
        run: cd web && npm run lint || true
        continue-on-error: true

      - name: TypeScript type check (Payload CMS)
        run: cd payload-cms && npx tsc --noEmit || true
        continue-on-error: true

  # ==================== Build Payload CMS ====================
  build-payload-cms:
    name: Build Payload CMS
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (root workspace)
        run: npm ci

      - name: Build Payload CMS
        run: cd payload-cms && npm run build
        env:
          DATABASE_URI: postgresql://test:test@localhost:5432/test
          PAYLOAD_SECRET: ci-build-test-secret-32chars-minimum

  # ==================== Build Web ====================
  build-web:
    name: Build Web
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (root workspace)
        run: npm ci

      - name: Build Web
        run: cd web && npm run build
        env:
          CMS_URL: http://localhost:3002
          CMS_GRAPHQL_URL: http://localhost:3002/api/graphql

  # ==================== Docker Build Test ====================
  docker-build:
    name: Docker Build Test
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Payload CMS Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.payload-cms
          push: false
          tags: busrom-payload-cms:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.web
          push: false
          tags: busrom-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== Security Scan ====================
  security:
    name: Security Audit
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit (Web)
        run: cd web && npm audit --audit-level=high || true
        continue-on-error: true

      - name: Run npm audit (Payload CMS)
        run: cd payload-cms && npm audit --audit-level=high || true
        continue-on-error: true
