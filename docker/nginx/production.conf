# ==============================================================================
# Busrom Production - Nginx Configuration
# ==============================================================================
# Routes:
#   cms.busromhouse.com     -> Payload CMS (ECS Service: cms)
#   cdp.busromhouse.com     -> CDP Analytics (ECS Service: cdp)
#   www.busromhouse.com     -> Web Frontend (ECS Service: web)
# ==============================================================================

# Upstream services (ECS Service Discovery or ALB)
upstream cms_backend {
    server cms.busrom.local:3000;
}

upstream cdp_backend {
    server cdp.busrom.local:3003;
}

upstream web_backend {
    server web.busrom.local:3001;
}

# CMS Server
server {
    listen 80;
    server_name cms.busromhouse.com;

    location / {
        proxy_pass http://cms_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# CDP Server
server {
    listen 80;
    server_name cdp.busromhouse.com;

    location / {
        proxy_pass http://cdp_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Web Frontend
server {
    listen 80;
    server_name www.busromhouse.com busromhouse.com;

    location / {
        proxy_pass http://web_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
